name: Android

on:
  push:
    branches: [main, feature/primeira-versao]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |FAILED|What went wrong|Exception" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: uniplanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare release files
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk UniPlanner.apk
          # The notes travel with the version, so the update question can say what is new.
          jq --argjson code "${GITHUB_RUN_NUMBER}" --arg name "0.2.${GITHUB_RUN_NUMBER}" \
            '{versionCode: $code, versionName: $name, notes: .}' app/src/main/assets/novidades.json > version.json
          cat version.json
      # Direct phone-friendly link: /releases/latest/download/UniPlanner.apk
      # Keep the release tag on the newest commit, so it never points at old history.
      - name: Move release tag
        if: github.event_name == 'push'
        run: |
          git tag -f versao-teste
          git push -f origin refs/tags/versao-teste
      - name: Publish test release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: versao-teste
          name: UniPlanner (versão de teste)
          body: Versão de teste gerada automaticamente a partir do commit ${{ github.sha }}.
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            UniPlanner.apk
            version.json
